<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
<form id="formulario_suscripción">
    <p>
Nombre: <input type="text" name="nombre" placeholder="nombre">
    </p>
    <p>
Apellido: <input type="text" name="apellido" placeholder="apellido">
    </p>
    <p>
Sexo: Masculino <input type="radio" name="sexo" value="Masculino"> Femenino <input type="radio" name="sexo" value="Femenino">
    </p>
    <p>
Edad: <input type="number" name="edad" placeholder="edad">
    </p>
    <p>
Email: <input type="email" name="email" placeholder="email@.com">
    </p>
    <p>
Usuario: <input type="text" name="user" placeholder="Usuario">
    </p>
    <p>
Password: <input type="password" name="pass" placeholder="password">
    </p>
    <p>
Confirmar Password: <input type="password" name="confirm pass" placeholder="password">
    </p>
    <p>
Tipo de servicio: Free <input type="checkbox" name="tipo_servicio" value="free"> / Standard <input type="checkbox" name="tipo_servicio" value="Standard"> / Premium <input type="checkbox" name="tipo_servicio" value="Premium">
    </p>
    <p>
Tema: 
    <select name="" id="">
            <option>Política</option>
            <option>Negocios</option>
            <option>Tecnología</option>
            <option>Salud</option>
    </select>
    </p>
    <p>
Agregue un comentario: <textarea></textarea>
    </p>
    <p>
Boton de Enviar <button>boton de Enviar</button>
    </p>

</form>
</body>
</html>
