<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
<form id="formulario_suscripción">
    <p>
        <label for="nombre">nombre:</label>
Nombre: <input type="text" id="nombre" name="nombre" placeholder="nombre">
    </p>
    <p>
        <label for="apellido">apellido:</label>
Apellido: <input type="text" id="apellido" name="apellido" placeholder="apellido">
    </p>
    <p>
        <label for="masculino">masculino</label>
        <label for="femenino">femenino</label>
Sexo: Masculino <input type="radio" id="masculino" name="sexo" value="Masculino"> Femenino <input type="radio" id="femenino" name="sexo" value="Femenino">
    </p>
    <p>
        <label for="edad">edad:</label>
Edad: <input type="number" id="edad" name="edad" placeholder="edad">
    </p>
    <p>
        <label for="email">email:</label>
Email: <input type="email" id="email" name="email" placeholder="email@.com">
    </p>
    <p>
        <label for="usuario">usuario:</label>
Usuario: <input type="text" id="usuario" name="user" placeholder="Usuario">
    </p>
    <p>
        <label for="password">password:</label>
Password: <input type="password" id="password" name="pass" placeholder="password">
    </p>
    <p>
        <label for="passconfirm">passconfirm:</label>
Confirmar Password: <input type="password" id="passconfirm" name="confirm pass" placeholder="password">
    </p>
    <p>
        <label for="servicio">servicio</label>
Tipo de servicio: Free <input type="checkbox" id="servicio" name="tipo_servicio" value="free"> / Standard <input type="checkbox" name="tipo_servicio" value="Standard"> / Premium <input type="checkbox" name="tipo_servicio" value="Premium">
    </p>
    <p>
Tema: 
    <select name="" id="">
        <label for="politica">politica</label>
            <option id="polotica">Política</option>
        <label for="negocios">negocios:</label>
            <option id="negocios">Negocios</option>
        <label for="tecnologia">tecnologia</label>
            <option id="tecnologia">Tecnología</option>
        <label for="salud">salud</label>
            <option id="salud">Salud</option>
    </select>
    </p>
    <p>
        <label for="comentario">comentario:</label>
Agregue un comentario: <textarea id="comentario"></textarea>
    </p>
    <p>
Boton de Enviar <button>boton de Enviar</button>
    </p>

</form>
</body>
</html>
