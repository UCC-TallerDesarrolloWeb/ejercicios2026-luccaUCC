<!DOCTYPE html>
<html lang="es">
<head> 
    <title>Catálogo de Productos</title>
    <link href="catalogo.css" type="text/css" rel="stylesheet">
    <script type="text/javascript" src="tienda.js"></script>
</head>
<body class="grid-container" onload="mostrarcatalogo()">
    <header class="item1">
        Catalogo de Productos
    </header>
    <nav class="item2">
        <a href="productos.html">Catálogo de Productos</a>
        <a href="carrito.html">Carrito de compras (<span id="contador">0</span>)</a>
    </nav>
    <aside class="item3">
        <form name="filter">
            <fieldset>
                <legend>Búsqueda</legend>
                <label for="search">Buscar:</label>
                <input type="text" id="search" name="search" oninput="mostrarcatalogo()">
            </fieldset>
            <fieldset>
                <legend>Precios</legend>
                <p>
                <label for="minimo">Mínimo</label>
                <input type="number" id="minimo" name="precio-min" min="0" oninput="mostrarcatalogo()">
                </p>
                <p>
                <label for="maximo">Máximo:</label>
                <input type="number" id="maximo" name="precio-max" min="0" oninput="mostrarcatalogo()">
                </p>
            </fieldset>
            <fieldset>
                <legend>Marca</legend>
                <select id="marca" name="marca" onchange="mostrarcatalogo()">
                    <option value="">Todas</option>
                    <option value="Gran Marc">Gran Marc</option>
                    <option value="Daedo">Daedo</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>Tipo de Productos</legend>
                <p>
                    <input type="checkbox" id="protectores" name="tipo" value="protectores" oninput="mostrarcatalogo()">
                    <label for="protectores">Protectores</label>
                </p>
                <p>
                    <input type="checkbox" id="entrenamiento" name="tipo" value="entrenamiento" oninput="mostrarcatalogo()">
                    <label for="entrenamiento">Entrenamiento</label>
                </p>
                <p>
                    <input type="checkbox" id="dobok" name="tipo" value="dobok" oninput="mostrarcatalogo()">
                    <label for="dobok">Dobok</label>
                </p>
            </fieldset>
            <fieldset>
                <legend>Ordenar</legend>
                <select id="orden" name="orden" onchange="mostrarcatalogo()">
                    <option value="">Sin orden</option>
                    <option value="menor">Precio: menor a mayor</option>
                    <option value="mayor">Precio: mayor a menor</option>
                    <option value="nombreaz">Nombre: A - Z</option>
                    <option value="nombreza">Nombre: Z - A</option>
                </select>
            </fieldset>
        </form>
    </aside>
    <dialog id="modal">
            <h2 id="nombreproducto">cabezal</h2>
            <p id="descripcionproducto">cabezal de sparring disponible en color azul o rojo.</p>
            <button type="button" onclick="cerrarmodal()">cerrar</button>
        </dialog>
    <main class="item4" id="catalogo">
        
    </main>
    <footer class="item5">
        contacto
    </footer>
</body>
</html>
